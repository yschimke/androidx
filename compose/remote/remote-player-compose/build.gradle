import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
}

androidx {
    name = "Remote Compose Player Compose"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2025"
    description = "Compose player for RemoteCompose documents"
    addGoldenImageAssets()
}

androidXMultiplatform {
    androidLibrary {
        withJava()
        namespace = "androidx.compose.remote.player.compose"
        minSdk { version = release(29) }
    }
    jvm()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        jvmAndAndroidMain.dependencies {
            implementation(project(":compose:remote:remote-core"))
            // Compose APIs for shared code are compileOnly here so the shared-metadata compilation
            // resolves androidx.compose.* without leaking an artifact to the leaves: androidMain
            // supplies AndroidX compose, jvmMain supplies the JetBrains CMP `-desktop` artifacts.
            compileOnly(project(":compose:foundation:foundation"))
            compileOnly(project(":compose:material3:material3"))
            compileOnly(project(":compose:ui:ui"))
        }

        androidMain.dependencies {
            implementation(project(":compose:remote:remote-player-core"))
            implementation(project(":compose:remote:remote-player-view"))
            implementation(libs.androidx.core)
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation(project(":compose:foundation:foundation"))
            implementation(project(":compose:material3:material3"))
            implementation(project(":compose:ui:ui"))
            implementation("androidx.tracing:tracing-ktx:1.3.0")
            implementation("androidx.activity:activity-compose:1.9.0")
        }

        // The non-Android JVM (desktop) target renders with JetBrains Compose Multiplatform
        // (Skiko-backed). AndroidX's own compose:* publishes only `jvmStubs()` for non-Android
        // JVM — a compile-time stub that throws at runtime — so the desktop player must use the
        // CMP `-desktop` artifacts to actually render.
        jvmMain.dependencies {
            def cmp = "1.8.2"
            implementation("org.jetbrains.compose.runtime:runtime-desktop:$cmp")
            implementation("org.jetbrains.compose.foundation:foundation-desktop:$cmp")
            implementation("org.jetbrains.compose.material3:material3-desktop:$cmp")
            implementation("org.jetbrains.compose.ui:ui-desktop:$cmp")
        }
    }
}

configurations.all {
    resolutionStrategy {
        force("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0")
        force("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0")
        force("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
    }
}
